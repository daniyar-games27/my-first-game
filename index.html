<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HIGHWAY RUSH</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080b12;color:white;font-family:Arial,sans-serif;overflow:hidden}
canvas{display:block;width:100vw;height:100vh}
#hud{position:absolute;top:18px;left:18px;right:18px;display:flex;justify-content:space-between;pointer-events:none;text-shadow:0 2px 8px #000}
.panel{background:#101827dd;border:1px solid #ffffff25;padding:12px 17px;border-radius:12px}
.big{font-size:27px;font-weight:900;color:#54eaff}
.small{font-size:10px;color:#9eafc4;letter-spacing:2px;margin-bottom:4px}
#message{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#050912c9}
.menu{width:min(90%,420px);padding:30px;background:#111b2c;border:1px solid #35cfff55;border-radius:20px;text-align:center;box-shadow:0 0 50px #00c8ff22}
h1{font-size:38px;font-weight:1000;font-style:italic;color:#4be6ff}
.menu p{color:#aabbd0;line-height:1.6;margin:16px 0}
button{border:0;border-radius:10px;padding:15px 22px;font-weight:bold;background:#31d8f4;color:#07121c;font-size:16px;cursor:pointer}
#controls{position:absolute;bottom:25px;left:0;right:0;display:flex;justify-content:space-between;padding:0 25px;pointer-events:none}
.group{display:flex;gap:12px}
.ctrl{pointer-events:auto;width:65px;height:65px;border-radius:16px;background:#101d2ccc;color:white;border:1px solid #ffffff55;font-size:25px;touch-action:none}
#hint{position:absolute;bottom:105px;width:100%;text-align:center;color:#ffffff88;font-size:11px;pointer-events:none}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
 <div class="panel">
  <div class="small">SPEED</div>
  <div class="big"><span id="speed">0</span> <span style="font-size:12px">KM/H</span></div>
 </div>
 <div class="panel" style="text-align:right">
  <div class="small">DISTANCE</div>
  <div class="big"><span id="distance">0</span> M</div>
 </div>
</div>

<div id="hint">WASD / СТРЕЛКИ — УПРАВЛЕНИЕ</div>

<div id="controls">
 <div class="group">
  <button class="ctrl" id="left">◀</button>
  <button class="ctrl" id="right">▶</button>
 </div>
 <div class="group">
  <button class="ctrl" id="brake">▼</button>
  <button class="ctrl" id="gas">▲</button>
 </div>
</div>

<div id="message">
 <div class="menu">
  <h1>HIGHWAY<br>RUSH</h1>
  <p>Управляй машиной, обгоняй трафик и устанавливай новые рекорды!</p>
  <p>◈ 4 полосы движения<br>◈ Реалистичная перспектива<br>◈ Динамический трафик<br>◈ Звук двигателя</p>
  <button id="start">НАЧАТЬ ЗАЕЗД</button>
  <p style="font-size:11px">Нажми кнопку газа, чтобы разогнаться</p>
 </div>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W,H;
function resize(){
 W=canvas.width=innerWidth*devicePixelRatio;
 H=canvas.height=innerHeight*devicePixelRatio;
}
resize();
addEventListener("resize",resize);

let running=false;
let speed=0;
let distance=0;
let roadOffset=0;
let playerX=0;
let traffic=[];
let keys={};
let gas=false;
let brake=false;
let steer=0;
let last=0;
let engineAudio=null;
let engineOsc=null;
let engineGain=null;
let crashFlash=0;

const lanes=4;
const colors=["#e43d4d","#27b8ed","#f2c84b","#e8e8e8","#9b62ed","#35d28a"];

function startAudio(){
 if(engineAudio)return;
 try{
  engineAudio=new(window.AudioContext||window.webkitAudioContext)();
  engineOsc=engineAudio.createOscillator();
  engineGain=engineAudio.createGain();
  engineOsc.type="sawtooth";
  engineOsc.frequency.value=55;
  engineGain.gain.value=0.015;
  engineOsc.connect(engineGain);
  engineGain.connect(engineAudio.destination);
  engineOsc.start();
 }catch(e){}
}

function engine(){
 if(engineOsc){
  engineOsc.frequency.setTargetAtTime(45+speed*1.1,engineAudio.currentTime,0.08);
  engineGain.gain.setTargetAtTime(0.008+speed/18000,engineAudio.currentTime,0.1);
 }
}

function roadWidth(y){
 return W*(0.09+0.73*y/H);
}

function roadLeft(y){
 return W/2-roadWidth(y)/2;
}

function laneX(lane,y){
 return roadLeft(y)+roadWidth(y)*(lane+.5)/lanes;
}

function drawBackground(){
 let g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,"#78a8bd");
 g.addColorStop(.35,"#d4c39a");
 g.addColorStop(1,"#344a37");
 ctx.fillStyle=g;
 ctx.fillRect(0,0,W,H);

 // distant mountains
 ctx.fillStyle="#627b78";
 ctx.beginPath();
 ctx.moveTo(0,H*.39);
 for(let x=0;x<=W;x+=W/8){
  ctx.lineTo(x,H*(.25+Math.sin(x*.013)*.08));
 }
 ctx.lineTo(W,H*.5);
 ctx.lineTo(0,H*.5);
 ctx.fill();

 // scenery
 let spacing=105*devicePixelRatio;
 for(let i=0;i<15;i++){
  let y=((i*spacing+roadOffset*1.7)%(H+spacing))-spacing/2;
  let p=y/H;
  let left=roadLeft(Math.max(0,y));
  let right= W-left;
  for(let side of [-1,1]){
   let x=side===-1?left-W*.035:right+W*.035;
   let size=(.25+p)*W*.025;
   if(x<0||x>W)continue;

   // tree trunk
   ctx.fillStyle="#59412b";
   ctx.fillRect(x-size*.12,y-size*.3,size*.24,size*.8);
   // foliage
   ctx.fillStyle=i%2?"#1b6542":"#277a49";
   ctx.beginPath();
   ctx.arc(x,y-size*.5,size*.65,0,Math.PI*2);
   ctx.fill();
   ctx.fillStyle="#4c9b55";
   ctx.beginPath();
   ctx.arc(x-size*.2,y-size*.7,size*.28,0,Math.PI*2);
   ctx.fill();
  }
 }
}

function drawRoad(){
 let horizon=H*.32;
 let bottom=H;

 ctx.fillStyle="#34383e";
 ctx.beginPath();
 ctx.moveTo(roadLeft(horizon),horizon);
 ctx.lineTo(W-roadLeft(horizon),horizon);
 ctx.lineTo(W-roadLeft(bottom),bottom);
 ctx.lineTo(roadLeft(bottom),bottom);
 ctx.fill();

 // road shoulders
 for(let side of [-1,1]){
  ctx.fillStyle="#ddd6c2";
  ctx.beginPath();
  ctx.moveTo(side<0?roadLeft(horizon):W-roadLeft(horizon),horizon);
  ctx.lineTo(side<0?roadLeft(bottom):W-roadLeft(bottom),bottom);
  ctx.lineTo(side<0?roadLeft(bottom)-W*.014:W-roadLeft(bottom)+W*.014,bottom);
  ctx.lineTo(side<0?roadLeft(horizon)-W*.014:W-roadLeft(horizon)+W*.014,horizon);
  ctx.fill();
 }

 // lane markings
 for(let lane=1;lane<lanes;lane++){
  for(let i=0;i<18;i++){
   let y=(i*H*.085+roadOffset*2.1)%(H*.7)+H*.3;
   let p=(y-H*.3)/(H*.7);
   let x=roadLeft(y)+roadWidth(y)*lane/lanes;
   let dash=H*(.012+p*.018);
   ctx.fillStyle="#f4f2dc";
   ctx.fillRect(x-H*.002,y,dash*.12,dash);
  }
 }

 // road texture
 for(let i=0;i<55;i++){
  let y=(i*H/55+roadOffset*3)%(H*.7)+H*.3;
  let x=roadLeft(y)+Math.random()*roadWidth(y);
  ctx.fillStyle="#ffffff0c";
  ctx.fillRect(x,y,2*devicePixelRatio,2*devicePixelRatio);
 }
}

function drawCar(x,y,w,h,color,player=false){
 ctx.save();
 ctx.translate(x,y);

 // shadow
 ctx.fillStyle="#0008";
 ctx.beginPath();
 ctx.ellipse(0,h*.44,w*.7,h*.14,0,0,Math.PI*2);
 ctx.fill();

 // wheels
 ctx.fillStyle="#111";
 for(let side of [-1,1]){
  ctx.fillRect(side*w*.43-w*.07,-h*.22,w*.14,h*.48);
  ctx.fillRect(side*w*.43-w*.07,h*.2,w*.14,h*.22);
 }

 // body
 let grad=ctx.createLinearGradient(-w/2,0,w/2,0);
 grad.addColorStop(0,"#222");
 grad.addColorStop(.25,color);
 grad.addColorStop(.75,color);
 grad.addColorStop(1,"#111");
 ctx.fillStyle=grad;
 ctx.beginPath();
 ctx.moveTo(-w*.42,h*.35);
 ctx.lineTo(-w*.48,-h*.05);
 ctx.lineTo(-w*.31,-h*.38);
 ctx.lineTo(-w*.22,-h*.52);
 ctx.lineTo(w*.22,-h*.52);
 ctx.lineTo(w*.31,-h*.38);
 ctx.lineTo(w*.48,-h*.05);
 ctx.lineTo(w*.42,h*.35);
 ctx.closePath();
 ctx.fill();

 // windshield
 ctx.fillStyle="#152c3d";
 ctx.beginPath();
 ctx.moveTo(-w*.29,-h*.1);
 ctx.lineTo(-w*.2,-h*.42);
 ctx.lineTo(w*.2,-h*.42);
 ctx.lineTo(w*.29,-h*.1);
 ctx.fill();

 // rear glass
 ctx.fillStyle="#24475b";
 ctx.fillRect(-w*.27,h*.03,w*.54,h*.12);

 // lights
 ctx.fillStyle=player?"#ffefb1":"#ff3344";
 ctx.fillRect(-w*.38,h*.23,w*.19,h*.07);
 ctx.fillRect(w*.19,h*.23,w*.19,h*.07);

 if(player){
  ctx.fillStyle="#ffffff55";
  ctx.fillRect(-w*.04,-h*.47,w*.08,h*.62);
 }
 ctx.restore();
}

function spawnCar(){
 let lane=Math.floor(Math.random()*lanes);
 if(traffic.some(c=>c.lane===lane&&c.y<H*.45))return;
 traffic.push({
  lane,
  y:-H*.2,
  speed:Math.random()*30+30,
  color:colors[Math.floor(Math.random()*colors.length)],
  size:Math.random()*.12+.17
 });
}

let spawnTimer=0;

function update(dt){
 if(!running)return;

 let acceleration=(gas||keys.ArrowUp||keys.w)?100:0;
 let deceleration=(brake||keys.ArrowDown||keys.s)?170:0;

 speed+=acceleration*dt;
 speed-=deceleration*dt;
 speed-=speed*.12*dt;
 speed=Math.max(0,Math.min(230,speed));

 if(keys.ArrowLeft||keys.a)steer=-1;
 else if(keys.ArrowRight||keys.d)steer=1;
 else steer=0;

 playerX+=steer*dt*(.85+speed/160);
 playerX=Math.max(-.9,Math.min(.9,playerX));

 distance+=speed*dt/3.6;
 roadOffset+=speed*dt*.7;
 engine();

 spawnTimer+=dt;
 if(spawnTimer>Math.max(.4,1.3-speed/350)){
  spawnCar();
  spawnTimer=0;
 }

 for(let c of traffic){
  c.y+=(speed-c.speed)*dt*H*.0008+H*.12*dt;
 }

 traffic=traffic.filter(c=>c.y<H+100);

 for(let c of traffic){
  let px=laneX(1.5+playerX,c.y);
  let cx=laneX(c.lane,c.y);
  let scale=c.y/H;
  if(c.y>H*.72&&Math.abs(px-cx)<W*.065&&Math.abs(c.y-H*.87)<H*.09){
   speed*=.45;
   c.y=-H;
   crashFlash=.25;
  }
 }
 crashFlash=Math.max(0,crashFlash-dt);
 document.getElementById("speed").textContent=Math.round(speed);
 document.getElementById("distance").textContent=Math.floor(distance);
}

function render(){
 drawBackground();
 drawRoad();

 // traffic
 for(let c of traffic){
  let y=c.y;
  let x=laneX(c.lane,y);
  let scale=.3+y/H*1.5;
  let w=W*.045*scale;
  let h=w*1.8;
  drawCar(x,y,w,h,c.color);
 }

 let playerY=H*.87;
 let playerLane=laneX(1.5+playerX,playerY);
 let pw=W*.075;
 drawCar(playerLane,playerY,pw,pw*1.8,"#13bfe8",true);

 if(crashFlash>0){
  ctx.fillStyle="rgba(255,40,40,"+crashFlash+")";
  ctx.fillRect(0,0,W,H);
 }
}

function loop(t){
 let dt=Math.min((t-last)/1000,.04)||0;
 last=t;
 update(dt);
 render();
 requestAnimationFrame(loop);
}

document.getElementById("start").onclick=()=>{
 document.getElementById("message").style.display="none";
 startAudio();
 if(engineAudio&&engineAudio.state==="suspended")engineAudio.resume();
 running=true;
};

function hold(id,action){
 let el=document.getElementById(id);
 el.addEventListener("pointerdown",e=>{e.preventDefault();action(true)});
 el.addEventListener("pointerup",e=>{e.preventDefault();action(false)});
 el.addEventListener("pointerleave",()=>action(false));
 el.addEventListener("pointercancel",()=>action(false));
}
hold("gas",v=>gas=v);
hold("brake",v=>brake=v);
hold("left",v=>{if(v)keys.ArrowLeft=true;else keys.ArrowLeft=false});
hold("right",v=>{if(v)keys.ArrowRight=true;else keys.ArrowRight=false});

addEventListener("keydown",e=>{
 keys[e.key]=true;
 if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();
});
addEventListener("keyup",e=>keys[e.key]=false);

requestAnimationFrame(loop);
</script>
</body>
</html>
